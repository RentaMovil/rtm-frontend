# Frontend en la red compartida "rentamovil" (la crean los repos del backend).
# Antes hay que tener arriba sqlserver, iam, fleet-maintenance, booking-reservation,
# payment-billing, telemetry-gps y api-gateway.
#   docker compose up -d --build      ->  http://localhost:4173
services:
  web:
    build: .
    container_name: rentamovil-web
    environment:
      # El proxy /api de vite.config.js apunta al gateway por su nombre en la red
      GATEWAY_URL: http://api-gateway:8080
    ports:
      - "127.0.0.1:4173:4173"
    networks: [rentamovil]
    restart: unless-stopped

networks:
  rentamovil:
    external: true
